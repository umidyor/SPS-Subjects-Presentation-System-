<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SPS — Smart Presentation System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #1a56db;
            --brand-dark: #1040b0;
            --brand-soft: #e8f0fe;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --surface: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
        }
        body { font-family: 'Sora', sans-serif; background: var(--surface); color: var(--text); }
        code, .mono { font-family: 'JetBrains Mono', monospace; }

        /* NAVBAR */
        .sps-nav {
            background: #fff;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 0 var(--border);
        }
        .sps-nav .navbar-brand { font-weight: 700; font-size: 1.1rem; color: var(--brand) !important; letter-spacing: -.5px; }
        .sps-nav .nav-link { font-size: .875rem; font-weight: 500; color: var(--muted) !important; transition: color .15s; }
        .sps-nav .nav-link:hover { color: var(--brand) !important; }
        .sps-nav .nav-link.active { color: var(--brand) !important; }

        /* LAYOUT */
        .main-content { min-height: calc(100vh - 64px); padding: 2rem 0; }

        /* CARDS */
        .card { border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--card-shadow); }
        .card-header { border-bottom: 1px solid var(--border); background: #fff; border-radius: 12px 12px 0 0 !important; }

        /* BADGES */
        .badge { font-weight: 500; letter-spacing: .2px; }

        /* STAT CARD */
        .stat-card { border-radius: 12px; border: 1px solid var(--border); background: #fff; padding: 1.25rem 1.5rem; box-shadow: var(--card-shadow); }
        .stat-card .stat-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .stat-card .stat-value { font-size: 1.75rem; font-weight: 700; line-height: 1; letter-spacing: -.5px; }
        .stat-card .stat-label { font-size: .8rem; color: var(--muted); font-weight: 500; }

        /* BREADCRUMB */
        .breadcrumb-item a { color: var(--brand); text-decoration: none; font-size: .85rem; }
        .breadcrumb-item.active { font-size: .85rem; }

        /* BUTTONS */
        .btn-brand { background: var(--brand); color: #fff; border: none; font-weight: 600; font-size: .875rem; }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }

        /* TOASTS */
        .toast-container { z-index: 1090; }

        /* TABLE */
        .sps-table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--border); background: #fafafa; }
        .sps-table td { font-size: .9rem; vertical-align: middle; }
        .sps-table tr:hover td { background: var(--brand-soft); }

        /* SHAREABLE LINK */
        .share-link-input { font-family: 'JetBrains Mono', monospace; font-size: .82rem; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; padding: .4rem .75rem; color: var(--muted); }

        /* ANIMATIONS */
        @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
        .fade-up { animation: fadeUp .35s ease both; }
        .fade-up-1 { animation-delay: .05s; }
        .fade-up-2 { animation-delay: .1s; }
        .fade-up-3 { animation-delay: .15s; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg sps-nav sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            <i class="bi bi-layers-fill me-1"></i>SPS
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row align-items-center gap-3">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                <i class="bi bi-grid-1x2 me-1"></i>Dashboard
            </a>
            <a class="nav-link" href="{% url 'create_quiz' %}">
                <i class="bi bi-plus-circle me-1"></i>Test yaratish
            </a>
            <div class="vr opacity-25 mx-1" style="height:20px;"></div>
            <span class="text-muted small fw-500"><i class="bi bi-person-circle me-1"></i>{{ user.get_full_name|default:user.username }}</span>
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'admin:logout' %}">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show fade-up mb-3" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
