<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi test yaratish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .question-block { background: #ffffff; border: 2px solid #e9ecef; border-radius: 12px; position: relative; transition: 0.3s; }
        .question-block:hover { border-color: #0d6efd; }
        .choice-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 5px; background: #f8f9fa; border-radius: 5px; }
        .remove-btn { position: absolute; top: 15px; right: 15px; color: #dc3545; cursor: pointer; font-weight: bold; }
        .remove-btn:hover { text-decoration: underline; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow p-4 border-0">
                <h2 class="mb-4 text-center fw-bold">Yangi test yaratish</h2>
                
                <div class="mb-4 border-bottom pb-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Test nomi *</label>
                            <input type="text" id="quiz-title" class="form-control form-control-lg" placeholder="Masalan: Python bo'yicha yakuniy test" oninput="saveDraft()">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-primary">Mavzuni tanlang *</label>
                            <select id="topic-id" class="form-select form-control-lg" onchange="saveDraft()">
                                <option value="">--- Mavzuni tanlang ---</option>
                                {% for topic in user_topics %}
                                    <option value="{{ topic.id }}">{{ topic.title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold text-secondary">Vaqt (min)</label>
                            <input type="number" id="quiz-time" class="form-control form-control-lg" value="15" oninput="saveDraft()">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold text-secondary">Tavsif (ixtiyoriy)</label>
                            <textarea id="quiz-desc" class="form-control" rows="2" placeholder="Test haqida qisqacha ma'lumot..." oninput="saveDraft()"></textarea>
                        </div>
                    </div>
                </div>

                <div id="questions-list"></div>

                <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-white sticky-bottom border-top">
                    <button type="button" class="btn btn-outline-primary btn-lg" onclick="addQuestion()">+ Savol qo'shish</button>
                    <button type="button" class="btn btn-success btn-lg px-5" onclick="submitQuiz()">Testni saqlash va e'lon qilish</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let questionCounter = 0;

    // 1. Yangi savol qo'shish
    function addQuestion() {
        questionCounter++;
        const qId = `q_${Date.now()}`; // Unique ID
        const html = `
            <div class="question-block p-4 mb-4 shadow-sm" id="${qId}">
                <span class="remove-btn" onclick="removeElement('${qId}')">O'chirish</span>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Savol matni</label>
                    <input type="text" class="form-control q-text" placeholder="Savolni kiriting..." oninput="saveDraft()">
                </div>
                
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Savol turi</label>
                        <select class="form-select q-type" onchange="saveDraft()">
                            <option value="single">Bitta to'g'ri javob (Radio)</option>
                            <option value="multiple">Ko'p to'g'ri javob (Checkbox)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ball</label>
                        <input type="number" class="form-control q-points" value="5" oninput="saveDraft()">
                    </div>
                </div>

                <div class="choices-section mt-3">
                    <h6 class="fw-bold small text-muted">Javob variantlari:</h6>
                    <div class="choices-list" id="choices_for_${qId}"></div>
                    <button type="button" class="btn btn-sm btn-outline-info mt-2" onclick="addChoice('${qId}')">+ Variant qo'shish</button>
                </div>
            </div>
        `;
        document.getElementById('questions-list').insertAdjacentHTML('beforeend', html);
        addChoice(qId); // Har doim kamida bitta variant qo'shib qo'yamiz
        saveDraft();
    }

    // 2. Variant qo'shish
    function addChoice(qId) {
        const choiceContainer = document.querySelector(`#choices_for_${qId}`);
        const cId = `c_${Date.now()}`;
        const html = `
            <div class="choice-row" id="${cId}">
                <input type="checkbox" class="form-check-input is-correct" onchange="saveDraft()">
                <input type="text" class="form-control form-control-sm choice-text" placeholder="Variantni yozing..." oninput="saveDraft()">
                <button type="button" class="btn-close ms-auto" style="width: 10px; height: 10px;" onclick="removeElement('${cId}')"></button>
            </div>
        `;
        choiceContainer.insertAdjacentHTML('beforeend', html);
        saveDraft();
    }

    function removeElement(id) {
        document.getElementById(id).remove();
        saveDraft();
    }

    // 3. DOIMIY SAQLASH (LocalStorage)
    function saveDraft() {
        const questions = [];
        document.querySelectorAll('.question-block').forEach(block => {
            const choices = [];
            block.querySelectorAll('.choice-row').forEach(row => {
                choices.push({
                    text: row.querySelector('.choice-text').value,
                    is_correct: row.querySelector('.is-correct').checked
                });
            });

            questions.push({
                text: block.querySelector('.q-text').value,
                type: block.querySelector('.q-type').value,
                points: block.querySelector('.q-points').value,
                choices: choices
            });
        });

        const draft = {
            topic_id: document.getElementById('topic-id').value,
            title: document.getElementById('quiz-title').value,
            time_limit: document.getElementById('quiz-time').value,
            description: document.getElementById('quiz-desc').value,
            questions: questions
        };
        localStorage.setItem('quiz_draft', JSON.stringify(draft));
    }

    // 4. SERVERGA YUBORISH (Shartlar bilan)
    async function submitQuiz() {
        saveDraft(); // Oxirgi holatni saqlash
        const data = JSON.parse(localStorage.getItem('quiz_draft'));

        // SHARTLAR
        if (!data.topic_id) return alert("Iltimos, mavzuni tanlang!");
        if (!data.title.trim()) return alert("Test nomini kiriting!");
        if (data.questions.length === 0) return alert("Kamida bitta savol qo'shing!");

        for (let i = 0; i < data.questions.length; i++) {
            const q = data.questions[i];
            if (!q.text.trim()) return alert(`${i+1}-savol matni bo'sh!`);
            if (q.choices.length < 2) return alert(`${i+1}-savolda kamida 2ta variant bo'lsin!`);
            
            const hasCorrect = q.choices.some(c => c.is_correct);
            if (!hasCorrect) return alert(`${i+1}-savolda to'g'ri javob belgilanmagan!`);
        }

        // YUBORISH
        const response = await fetch('/quiz/create/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(data)
        });

        const res = await response.json();
        if (res.status === 'success') {
            alert("Muvaffaqiyatli saqlandi!");
            localStorage.removeItem('quiz_draft');
            window.location.href = '/dashboard/';
        } else {
            alert("Xatolik yuz berdi: " + res.message);
        }
    }
</script>

</body>
</html>
