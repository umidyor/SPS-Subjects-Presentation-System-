{% extends 'base.html' %}

{% block title %}Fayl yuklash{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4><i class="bi bi-cloud-upload"></i> Fayl yuklash</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">
                        <i class="bi bi-upload"></i> Yuklash
                    </button>
                    <a href="{% url 'topicdetails' view.kwargs.topic_uuid %}" class="btn btn-secondary w-100 mt-2">Bekor qilish</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
