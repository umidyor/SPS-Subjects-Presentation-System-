<form id="quiz-form" method="POST">
    {% csrf_token %}
    <h2>{{ quiz.title }}</h2>
    <input type="text" name="student_name" placeholder="Ismingizni kiriting" required class="form-control mb-4">

    {% for question in quiz.questions.all %}
    <div class="question mb-4">
        <p><strong>{{ forloop.counter }}. {{ question.text }}</strong></p>
        
        {% for choice in question.choices.all %}
        <div class="form-check">
            {% if question.question_type == 'multiple' %}
                <input type="checkbox" name="question_{{ question.id }}" value="{{ choice.id }}" class="form-check-input">
            {% else %}
                <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" class="form-check-input">
            {% endif %}
            <label class="form-check-label">{{ choice.text }}</label>
        </div>
        {% endfor %}
    </div>
    {% endfor %}

    <button type="submit" class="btn btn-success">Testni yakunlash</button>
</form>

<script>
    // Oddiy Timer mantiqi
    let timeLeft = {{ quiz.time_limit }} * 60;
    const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(timer);
            document.getElementById('quiz-form').submit(); // Vaqt tugasa avtomat topshiradi
        }
    }, 1000);
</script>
