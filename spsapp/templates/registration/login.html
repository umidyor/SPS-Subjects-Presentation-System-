{% extends "base.html" %}

{% block title %}Kirish - Dars Materiallari{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="bi bi-shield-lock"></i> Tizimga kirish</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Login</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Parol</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Kirish</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted text-center">
                Faqat o'qituvchilar uchun
            </div>
        </div>
    </div>
</div>
{% endblock %}
